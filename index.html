<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>我的投資總損益</title>
  <style>
    :root { --bg:#0b1020; --card:#151d33; --line:#27324e; --text:#f4f7ff; --muted:#99a7c3; --green:#55d69b; --red:#ff7285; --blue:#8fb4ff; --gold:#f6c66b; }
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 84% -10%,#243c77 0,transparent 30rem),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Noto Sans TC",sans-serif}
    button,input,select{font:inherit} button{cursor:pointer}.wrap{width:min(1180px,calc(100% - 32px));margin:auto}.hero{padding:48px 0 26px;display:flex;justify-content:space-between;gap:24px;align-items:flex-end}.eyebrow{letter-spacing:.13em;color:var(--blue);font-size:12px;font-weight:800;margin:0 0 8px}.hero h1{margin:0;font-size:clamp(30px,5vw,48px);letter-spacing:-.04em}.hero p{color:var(--muted);margin:10px 0 0}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#19233e;color:var(--text);font-weight:700}.btn.primary{background:var(--blue);border-color:var(--blue);color:#081126}.btn.danger{color:#ffc0c8}.summary{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:14px}.card{border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#17213a,#11182b);padding:20px;box-shadow:0 14px 35px #03061144}.label{color:var(--muted);font-size:13px}.value{font-size:26px;font-weight:800;letter-spacing:-.04em;margin:6px 0}.card.total .value{font-size:36px}.up{color:var(--green)}.down{color:var(--red)}.grid{display:grid;grid-template-columns:1.45fr 1fr;gap:14px;margin:14px 0}.panel{border:1px solid var(--line);border-radius:16px;background:#10182b;padding:20px}.panel h2{font-size:17px;margin:0 0 15px}.chart{height:255px;position:relative;overflow:hidden}.chart svg{width:100%;height:100%;overflow:visible}.chart .axis{stroke:#2a3652;stroke-width:1}.chart .area{fill:url(#area);opacity:.36}.chart .line{fill:none;stroke:var(--blue);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.empty{color:var(--muted);font-size:14px;padding:55px 0;text-align:center}.allocation{display:grid;grid-template-columns:145px 1fr;align-items:center;gap:12px}.donut{width:142px;height:142px;border-radius:50%;background:conic-gradient(var(--blue) 0 50%,var(--gold) 50% 100%);position:relative}.donut:after{content:"配置";display:grid;place-items:center;position:absolute;inset:25px;border-radius:50%;background:#10182b;color:var(--muted);font-weight:800}.legend{list-style:none;margin:0;padding:0}.legend li{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #202b45}.dot{display:inline-block;width:9px;height:9px;border-radius:999px;margin-right:8px}.blue{background:var(--blue)}.gold{background:var(--gold)}.holdings{margin:14px 0 42px}.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:28px 0 10px}.section-title h2{margin:0;font-size:20px}.section-title span{color:var(--muted);font-size:13px}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}table{border-collapse:collapse;width:100%;min-width:690px;background:#10182b}th,td{text-align:right;padding:14px 16px;border-bottom:1px solid #202b45;white-space:nowrap}th{color:var(--muted);font-size:12px;font-weight:700;background:#141d32}td:first-child,th:first-child{text-align:left}.ticker{font-weight:800}.market{font-size:11px;padding:3px 7px;border-radius:999px;background:#24365d;color:#bcd0ff;margin-left:7px}.market.us{background:#5a4524;color:#ffe1a0}.empty-row td{text-align:center;color:var(--muted);padding:30px}.modal{position:fixed;inset:0;background:#030611aa;display:none;place-items:center;padding:16px;z-index:5}.modal.open{display:grid}.form{width:min(590px,100%);max-height:92vh;overflow:auto;background:#151d33;border:1px solid #35456a;border-radius:18px;padding:22px}.form header{display:flex;justify-content:space-between;align-items:center}.form h2{margin:0}.close{border:0;background:transparent;color:var(--muted);font-size:26px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:18px 0}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}.field input,.field select{border:1px solid #334362;border-radius:9px;background:#0d1426;color:var(--text);padding:10px}.form footer{display:flex;justify-content:flex-end;gap:10px}.hint{color:var(--muted);font-size:13px;margin:0 0 8px}.notice{border-left:3px solid var(--gold);padding:10px 13px;background:#2a2415;color:#e8d9af;border-radius:6px;font-size:13px;margin:0 0 16px}@media(max-width:820px){.hero{align-items:flex-start;flex-direction:column;padding-top:30px}.summary{grid-template-columns:1fr 1fr}.card.total{grid-column:1/-1}.grid{grid-template-columns:1fr}.allocation{grid-template-columns:120px 1fr}.donut{width:120px;height:120px}.donut:after{inset:21px}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}}@media(max-width:480px){.wrap{width:min(100% - 22px,1180px)}.summary{gap:9px}.card{padding:15px}.value{font-size:20px}.card.total .value{font-size:30px}.actions .btn{flex:1}.panel{padding:16px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="hero"><div><p class="eyebrow">PERSONAL PORTFOLIO</p><h1>我的投資總損益</h1><p id="updated">手動記錄你的聯邦發發發台股與口袋證券美股複委託。</p></div><div class="actions"><button class="btn" id="demoBtn">載入範例</button><button class="btn danger" id="clearBtn">清除資料</button><button class="btn primary" id="addBtn">＋ 新增交易</button></div></header>
    <section class="summary"><article class="card total"><div class="label">總損益（TWD 估算）</div><div class="value" id="totalPnl">—</div><div id="totalRate" class="label">尚無交易資料</div></article><article class="card"><div class="label">總投入成本</div><div class="value" id="totalCost">—</div><div class="label">TWD 估算</div></article><article class="card"><div class="label">目前市值</div><div class="value" id="totalValue">—</div><div class="label">TWD 估算</div></article><article class="card"><div class="label">美金匯率</div><div class="value" id="fxDisplay">32.80</div><div class="label">可自行調整</div></article></section>
    <section class="grid"><article class="panel"><h2>總資產走勢</h2><p class="hint">每次新增交易會自動記錄一個快照；可用「新增交易」更新最新市價。</p><div class="chart" id="chart"></div></article><article class="panel"><h2>市場配置</h2><div class="allocation"><div class="donut" id="donut"></div><ul class="legend"><li><span><i class="dot blue"></i>台股</span><b id="twPct">—</b></li><li><span><i class="dot gold"></i>美股</span><b id="usPct">—</b></li><li><span>持倉數</span><b id="holdingCount">0</b></li></ul></div></article></section>
    <section class="holdings"><div class="section-title"><h2>持倉總覽</h2><span>點擊「新增交易」手動建立或更新持倉</span></div><div class="table-wrap"><table><thead><tr><th>標的</th><th>股數</th><th>平均成本</th><th>現價</th><th>成本</th><th>市值</th><th>損益</th><th></th></tr></thead><tbody id="holdingBody"></tbody></table></div></section>
  </main>
  <div class="modal" id="modal"><form class="form" id="tradeForm"><header><h2>新增／更新持倉</h2><button class="close" type="button" id="closeBtn">×</button></header><p class="notice">這是手動記帳工具，不會連線到券商或儲存任何帳號資料。台股金額以 TWD、美股以 USD 輸入。</p><div class="fields"><div class="field"><label>市場</label><select name="market"><option value="TW">台股（聯邦發發發）</option><option value="US">美股（口袋證券複委託）</option></select></div><div class="field"><label>股票代號</label><input name="symbol" placeholder="例如 2330、AAPL" required></div><div class="field full"><label>名稱（選填）</label><input name="name" placeholder="例如 台積電、Apple"></div><div class="field"><label>持有股數</label><input name="shares" type="number" min="0.0001" step="any" required></div><div class="field"><label>平均成本（每股）</label><input name="cost" type="number" min="0" step="any" required></div><div class="field"><label>目前價格（每股）</label><input name="price" type="number" min="0" step="any" required></div><div class="field"><label>USD/TWD 匯率</label><input name="fx" type="number" min="1" step="0.01" value="32.80"></div></div><footer><button class="btn" type="button" id="cancelBtn">取消</button><button class="btn primary" type="submit">儲存持倉</button></footer></form></div>
  <script>
    const KEY='personal-pnl-v1'; let data=JSON.parse(localStorage.getItem(KEY)||'{"holdings":[],"history":[],"fx":32.8}');
    const n=new Intl.NumberFormat('zh-TW',{maximumFractionDigits:0}), money=(x,c='TWD')=>c==='USD'?'US$ '+new Intl.NumberFormat('en-US',{maximumFractionDigits:2}).format(x):'NT$ '+n.format(x);
    function calc(h){const fx=data.fx||32.8, m=h.market==='US'?fx:1;return {cost:h.shares*h.cost*m,value:h.shares*h.price*m,pnl:(h.price-h.cost)*h.shares*m};}
    function save(){localStorage.setItem(KEY,JSON.stringify(data));}
    function render(){const hs=data.holdings, sums=hs.reduce((a,h)=>{const x=calc(h);a.cost+=x.cost;a.value+=x.value;a.pnl+=x.pnl;a[h.market]+=x.value;return a},{cost:0,value:0,pnl:0,TW:0,US:0}); const rate=sums.cost?sums.pnl/sums.cost*100:0;
      totalPnl.textContent=money(sums.pnl); totalPnl.className='value '+(sums.pnl>=0?'up':'down'); totalRate.textContent=sums.cost?`${sums.pnl>=0?'+':''}${rate.toFixed(2)}% 報酬率`:'尚無交易資料'; totalCost.textContent=money(sums.cost);totalValue.textContent=money(sums.value);fxDisplay.textContent=(data.fx||32.8).toFixed(2);holdingCount.textContent=hs.length;const tw=sums.value?sums.TW/sums.value*100:50;twPct.textContent=sums.value?tw.toFixed(1)+'%':'—';usPct.textContent=sums.value?(100-tw).toFixed(1)+'%':'—';donut.style.background=`conic-gradient(var(--blue) 0 ${tw}%,var(--gold) ${tw}% 100%)`;
      holdingBody.innerHTML=hs.length?hs.map((h,i)=>{const x=calc(h),c=h.market==='US'?'USD':'TWD';return `<tr><td><span class="ticker">${h.symbol}</span><span class="market ${h.market==='US'?'us':''}">${h.market==='US'?'美股':'台股'}</span><br><small class="label">${h.name||''}</small></td><td>${h.shares}</td><td>${money(h.cost,c)}</td><td>${money(h.price,c)}</td><td>${money(x.cost)}</td><td>${money(x.value)}</td><td class="${x.pnl>=0?'up':'down'}">${x.pnl>=0?'+':''}${money(x.pnl)}</td><td><button class="btn" onclick="removeHolding(${i})">刪除</button></td></tr>`}).join(''):'<tr class="empty-row"><td colspan="8">還沒有持倉。按右上角「新增交易」開始記錄。</td></tr>';
      drawChart(); updated.textContent=hs.length?`最後儲存：${new Date().toLocaleString('zh-TW')} · 資料僅保存在此瀏覽器`:'手動記錄你的聯邦發發發台股與口袋證券美股複委託。';}
    function drawChart(){const vals=data.history.map(x=>x.value); if(data.holdings.length)vals.push(data.holdings.reduce((s,h)=>s+calc(h).value,0)); if(!vals.length){chart.innerHTML='<div class="empty">新增交易後，這裡會顯示你的資產變化</div>';return}const min=Math.min(...vals)*.985,max=Math.max(...vals)*1.015,r=max-min||1,pts=vals.map((v,i)=>`${i/(Math.max(vals.length-1,1))*100},${100-(v-min)/r*82-9}`).join(' ');chart.innerHTML=`<svg viewBox="0 0 100 100" preserveAspectRatio="none"><defs><linearGradient id="area" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#8fb4ff"/><stop offset="1" stop-color="#8fb4ff" stop-opacity="0"/></linearGradient></defs><path class="axis" d="M0 20H100M0 50H100M0 80H100"/><polygon class="area" points="0,100 ${pts} 100,100"/><polyline class="line" points="${pts}"/></svg>`;}
    function removeHolding(i){if(confirm('確定刪除這筆持倉？')){data.holdings.splice(i,1);save();render();}} window.removeHolding=removeHolding;
    const modal=document.getElementById('modal'); addBtn.onclick=()=>modal.classList.add('open');closeBtn.onclick=cancelBtn.onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};
    tradeForm.onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));data.fx=Number(f.fx)||data.fx;const h={market:f.market,symbol:f.symbol.trim().toUpperCase(),name:f.name.trim(),shares:Number(f.shares),cost:Number(f.cost),price:Number(f.price)};const old=data.holdings.findIndex(x=>x.market===h.market&&x.symbol===h.symbol);old<0?data.holdings.push(h):data.holdings[old]=h;data.history.push({time:Date.now(),value:data.holdings.reduce((s,x)=>s+calc(x).value,0)});data.history=data.history.slice(-30);save();modal.classList.remove('open');e.target.reset();render();};
    demoBtn.onclick=()=>{if(data.holdings.length&&!confirm('載入範例會取代目前資料，是否繼續？'))return;data={fx:32.8,history:[],holdings:[{market:'TW',symbol:'2330',name:'台積電',shares:100,cost:840,price:1120},{market:'TW',symbol:'0050',name:'元大台灣50',shares:500,cost:170,price:205},{market:'US',symbol:'AAPL',name:'Apple',shares:10,cost:190,price:215},{market:'US',symbol:'VOO',name:'Vanguard S&P 500 ETF',shares:5,cost:500,price:580}]};save();render();}; clearBtn.onclick=()=>{if(confirm('清除所有持倉與走勢資料？此動作無法復原。')){data={holdings:[],history:[],fx:32.8};save();render();}};render();
  </script>
</body>
</html>

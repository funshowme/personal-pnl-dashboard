0 0 8px}.notice{border-left:3px solid var(--gold);padding:10px 13px;background:#2a2415;color:#e8d9af;border-radius:6px;font-size:13px;margin:0 0 16px}@media(max-width:820px){.hero{align-items:flex-start;flex-direction:column;padding-top:30px}.summary{grid-template-columns:1fr 1fr}.card.total{grid-column:1/-1}.grid{grid-template-columns:1fr}.allocation{grid-template-columns:120px 1fr}.donut{width:120px;height:120px}.donut:after{inset:21px}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}}@media(max-width:480px){.wrap{width:min(100% - 22px,1180px)}.summary{gap:9px}.card{padding:15px}.value{font-size:20px}.card.total .value{font-size:30px}.actions .btn{flex:1}.panel{padding:16px}}

  <script>
    const KEY='personal-pnl-v1'; let data=JSON.parse(localStorage.getItem(KEY)||'{"holdings":[],"history":[],"fx":32.8}');
    const n=new Intl.NumberFormat('zh-TW',{maximumFractionDigits:0}), money=(x,c='TWD')=>c==='USD'?'US$ '+new Intl.NumberFormat('en-US',{maximumFractionDigits:2}).format(x):'NT$ '+n.format(x);
    function calc(h){const fx=data.fx||32.8, m=h.market==='US'?fx:1;return {cost:h.shares*h.cost*m,value:h.shares*h.price*m,pnl:(h.price-h.cost)*h.shares*m};}
    function save(){localStorage.setItem(KEY,JSON.stringify(data));}
    function render(){const hs=data.holdings, sums=hs.reduce((a,h)=>{const x=calc(h);a.cost+=x.cost;a.value+=x.value;a.pnl+=x.pnl;a[h.market]+=x.value;return a},{cost:0,value:0,pnl:0,TW:0,US:0}); const rate=sums.cost?sums.pnl/sums.cost*100:0;

      drawChart(); updated.textContent=hs.length?`?敺摮?${new Date().toLocaleString('zh-TW')} 繚 鞈???摮甇斤汗?灼:'??閮?雿??舫?潛?澆?∟????霅蝢銴?閮?;}
    function drawChart(){const vals=data.history.map(x=>x.value); if(data.holdings.length)vals.push(data.holdings.reduce((s,h)=>s+calc(h).value,0)); if(!vals.length){chart.innerHTML='<div class="empty">?啣?鈭斗?敺??ㄐ?＊蝷箔????Ｚ???/div>';return}const min=Math.min(...vals)*.985,max=Math.max(...vals)*1.015,r=max-min||1,pts=vals.map((v,i)=>`${i/(Math.max(vals.length-1,1))*100},${100-(v-min)/r*82-9}`).join(' ');chart.innerHTML=`<svg viewBox="0 0 100 100" preserveAspectRatio="none"><defs><linearGradient id="area" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#8fb4ff"/><stop offset="1" stop-color="#8fb4ff" stop-opacity="0"/></linearGradient></defs><path class="axis" d="M0 20H100M0 50H100M0 80H100"/><polygon class="area" points="0,100 ${pts} 100,100"/><polyline class="line" points="${pts}"/></svg>`;}

    const modal=document.getElementById('modal'); addBtn.onclick=()=>modal.classList.add('open');closeBtn.onclick=cancelBtn.onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};
